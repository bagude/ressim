# Rock and pumping in, production out. Field units.
# Run:  .\ressim.ps1 design examples\design_to_production.toml
#
# Predicted here: each fracture's half-length and height (growth with height through stress barriers).
# Still declared by you: fracture conductivity and the share of created length that stays conductive.
# Fractures do not interact while growing. The fluid is the SPE1 benchmark oil, for illustration only.

[well]
name = "design_demo"
thickness_ft = 100.0            # pay thickness; also the layer the fractures start in
width_ft = 2000.0               # across the lateral
perm_md = 0.0005
porosity = 0.08
pressure_psi = 5000.0
bhp_psi = 1500.0
positions_ft = [100.0, 300.0, 500.0]
conductivity_mdft = 50.0        # declared, not predicted
edge_ft = 100.0
fluid = "blackoil_spe1"
months = 24
mesh = "coarse"

[rock]
barrier_psi = 600.0             # barrier closure stress minus pay closure stress
youngs_psi = 4.0e6
poisson = 0.25
toughness_psi_sqrtin = 1000.0
leakoff_ft_sqrtmin = 0.002

[pumping]
rate_bpm_per_fracture = [4.0, 8.0, 12.0]   # rate entering each fracture (both wings), not the stage total
minutes = 60.0
viscosity_cp = 3.0
propped_fraction = 0.6          # declared: share of the created half-length that stays conductive
