# Stages with several perforation clusters. Field units.
# Run:  .\ressim.ps1 design examples\design_with_clusters.toml
#
# Each stage is pumped at rate_bpm_per_fracture x clusters. The split of that rate between the
# clusters is solved: every cluster sees the same wellbore pressure, pays its own perforation
# friction, and is squeezed by the fractures next to it. Stage 1 has few, large perforations (weak
# friction, uneven split); stage 2 has limited entry (strong friction, even split).
# Stages are pumped in the order listed; each feels what the one before still holds open.
# Not modelled: screen-out pressure. The fluid is the SPE1
# benchmark oil, for illustration only.

[well]
name = "cluster_demo"
thickness_ft = 100.0
width_ft = 2000.0
perm_md = 0.0005
porosity = 0.08
pressure_psi = 5000.0
bhp_psi = 1500.0
positions_ft = [200.0, 400.0]        # stage centres
edge_ft = 100.0
fluid = "blackoil_spe1"
months = 24
mesh = "coarse"

[rock]
barrier_psi = 600.0
barrier_above_psi = 800.0            # optional: the rock above and below may differ
barrier_below_psi = 500.0
youngs_psi = 4.0e6
poisson = 0.25
toughness_psi_sqrtin = 1000.0
leakoff_ft_sqrtmin = 0.001

[pumping]
rate_bpm_per_fracture = 15.0         # the stage rate is this times the number of clusters
minutes = 45.0
viscosity_cp = 3.0
clusters = 4
cluster_spacing_ft = 40.0
shots_per_cluster = [24, 4]          # stage 1: 24 shots per cluster; stage 2: 4
perf_diameter_in = 0.4
discharge = 0.7
hours_between_stages = 2.0           # stages are pumped in the order listed; -1 ignores the stage before

[proppant]
start_fraction = [0.2, 0.5, 0.8]
ppa = [0.5, 1.0, 2.0]
diameter_mm = 0.2
closure_psi = 4000.0
