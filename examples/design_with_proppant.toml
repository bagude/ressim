# Rock, pumping and proppant in; production out. Field units.
# Run:  .\ressim.ps1 design examples\design_with_proppant.toml
#
# Predicted here: each fracture's length and height, where the proppant ends up along it, the propped
# half-length and the conductivity. Proppant settles into a bank at the bottom of the fracture; only the part
# of the bank inside the pay conducts. Not modelled: screen-out pressure, stress left by earlier stages. The fluid is the SPE1
# benchmark oil, for illustration only.

[well]
name = "proppant_demo"
thickness_ft = 100.0
width_ft = 2000.0
perm_md = 0.0005
porosity = 0.08
pressure_psi = 5000.0
bhp_psi = 1500.0
positions_ft = [100.0, 300.0, 500.0]
edge_ft = 100.0
fluid = "blackoil_spe1"
months = 24
mesh = "coarse"

[rock]
barrier_psi = 600.0
youngs_psi = 4.0e6
poisson = 0.25
toughness_psi_sqrtin = 1000.0
leakoff_ft_sqrtmin = 0.0005

[pumping]
rate_bpm_per_fracture = [4.0, 8.0, 12.0]
minutes = 60.0
viscosity_cp = 3.0

[proppant]
start_fraction = [0.2, 0.5, 0.8]     # when each concentration starts, as a share of the pumping time
ppa = [0.5, 1.0, 2.0]                # lb per gallon of clean fluid
diameter_mm = 0.2                    # about 100 mesh
closure_psi = 4000.0                 # stress on the pack once the well is drawn down
