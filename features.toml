[[feature]]
area = "Performance and robustness"
name = "Pressure-preconditioned (CPR) linear solver: same answer as incomplete LU with less than half the linear iterations (SPE9)"
known_for = "all majors"
tests = ["engine_cpr_solver"]
note = "engine feature (src/cpr.jl); it is also the default preconditioner of every deck run in this suite; compared at equal linear tolerance on the first 8 report steps"

[[feature]]
area = "Performance and robustness"
name = "Nonlinear domain decomposition as the nonlinear solver"
known_for = "INTERSECT (related methods), research codes"
tests = ["engine_nldd"]
note = "engine feature (src/NLDD); runs with a sixth of the global Newton steps, but in the first report steps of SPE1 its producer pressure is 1.3% from a tightly converged Newton run and tighter tolerances do not change that: misses the 1% bar"

[[feature]]
area = "Physics"
name = "CO2 and brine property correlations at two points known from elsewhere"
known_for = "ECLIPSE CO2STORE, GEM, tNavigator"
tests = ["engine_co2_properties"]
note = "engine feature (src/CO2Properties); CO2 density at 1 bar against the gas law with a virial correction (0.01%), water density at 250 bar (0.02%); reference values recalled, not fetched; solubility, salts and a storage run were not tested"
