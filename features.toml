# ==== STREAM 8 features (binary summary output) ====
[[feature]]
area = "Input and output"
name = "Summary vectors of any run in field or metric units: rates, totals and bottom-hole pressure by well, field sums, calendar columns"
known_for = "all"
tests = ["eclout_summary_spe1", "eclout_staged_well"]
note = "written here (summary_table); rates and pressures agree with the engine's own summary assembly to 6e-8, totals with the run's own per-stage accounting; the engine's own field-unit totals are 86,400 times too large (rate per day times seconds), which the test allows for; production and injection are separate positive vectors; no group, region, block or completion vectors"

[[feature]]
