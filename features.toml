# ==== STREAM 9 features (economics of a forecast) ====
[[feature]]
area = "Workflows"
name = "Cash flow of a forecast before income tax: price deck and differentials, working and net revenue interest, severance and ad valorem taxes, fixed and variable costs, capital by month"
known_for = "ComboCurve, ARIES, PHDwin, Enersight"
tests = ["econ_cash_by_hand", "econ_against_game", "econ_on_simulated_well"]
note = "written here; every convention is an argument with a stated default (research/economics-conventions.md); checked by arithmetic on paper and, set to the game's conventions, against the game's own Python economics to round-off; no income tax, depreciation, escalation, hedges or changing interests"

[[feature]]
area = "Workflows"
name = "NPV, rate of return, payout, returns on investment, economic limit and EUR to it, break-even price"
known_for = "ComboCurve, ARIES, PHDwin, Enersight"
tests = ["econ_discounting", "econ_return_and_payout", "econ_breakeven_spread_sensitivity", "econ_against_game"]
note = "effective annual rate at mid-month by default (end of month and nominal rates offered), capital at the start of its month; closed forms for annuities and an exponential decline; a cash flow with two rates of return is reported as such, not given one number; with a limit rule NPV can step down as price rises"

[[feature]]
area = "Workflows"
name = "Economics across an uncertainty run (P90 / P50 / P10 of NPV, chance of loss) and one-at-a-time sensitivities"
known_for = "ComboCurve, Enersight, tNavigator"
tests = ["econ_breakeven_spread_sensitivity"]
