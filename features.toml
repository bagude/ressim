# Feature list behind SCORECARD.md. The status column is derived, never typed in:
#   tests  = [...]   -> "verified here" only if every listed validation test passed in the last run
#   engine = "path"  -> "in engine, not run here" if that path exists in the installed engine source
#   absent = "regex" -> "absent" if no engine source file matches (case-insensitive); hits are reported
#   local  = "path"  -> exists in our own research track, not yet part of this package
# `known_for` is from recall of vendor products, not looked up; treat it as a pointer, not a citation.

# ---- physics ----
[[feature]]
area = "Physics"
name = "Single-phase depletion (transient and boundary-dominated)"
known_for = "all"
tests = ["exact_slab_inf", "exact_slab_trans", "exact_slab_depl"]

[[feature]]
area = "Physics"
name = "Two-phase immiscible displacement"
known_for = "all"
tests = ["exact_buckley_leverett"]

[[feature]]
area = "Physics"
name = "Three-phase black oil with dissolved gas, gravity, equilibrium initialisation"
known_for = "ECLIPSE 100, IMEX, Nexus, tNavigator, ECHELON, Tempest MORE"
tests = ["cross_spe1", "cross_spe9"]

[[feature]]
area = "Physics"
name = "SPE1 black oil against a second reference (MRST)"
known_for = "ECLIPSE 100, IMEX, Nexus, tNavigator, ECHELON, Tempest MORE"
tests = ["cross_spe1_mrst"]
note = "the row above misses on producer pressure against the OPM Flow reference; this row is the same benchmark against MRST"

[[feature]]
area = "Physics"
name = "Gas condensate: oil vaporised in the gas (SPE3)"
known_for = "ECLIPSE 100/300, GEM, tNavigator"
tests = ["cross_spe3_mrst"]
note = "agrees with MRST to 0.02% for 15 years; the miss is all in the final blowdown below the lowest pressure of the fluid table, where the engine holds gas properties constant and MRST extrapolates. Keep fluid tables wider than the pressures a run will reach"

[[feature]]
area = "Geology"
name = "Rock properties as correlated random fields with a stated variogram (model, range, sill, nugget, two ranges), sampled at any map position"
known_for = "Petrel, GeoGraphix, Petra, Kingdom (as the truth these tools estimate)"
tests = ["geology_fields"]
note = "written here; unconditional fields only: no conditioning to wells, no facies, no trends, one layer; the rock model has porosity, permeability, gross thickness, net-to-gross and water saturation"

[[feature]]
area = "Geology"
name = "Fractured well in rock that varies across the map: net pay, porosity, water saturation, permeability per cell"
known_for = "ECLIPSE, IMEX, tNavigator, Nexus"
tests = ["fracwell_maps", "placement_round_trip"]
note = "one layer; water is immobile (it only reduces the oil-filled pore volume); no outside reference"

[[feature]]
area = "Geology"
name = "Structure: top-of-pay surface with fault traces and throws, read along any lateral (top, base, fault crossings)"
known_for = "Petrel, GeoGraphix, Petra, Kingdom; geosteering packages"
tests = ["structure_surface"]
note = "written here; geometric faults (throw largest mid-trace, dying out with distance), no fault dip or drag; a synthetic surface is a dipping plane plus a correlated residual"

[[feature]]
area = "Geology"
name = "Sealing and leaky faults in the well model (transmissibility multipliers along fault traces)"
known_for = "ECLIPSE, IMEX, tNavigator, Nexus"
tests = ["fracwell_faults", "placement_round_trip"]
note = "the trace seals the cell faces it crosses, fractures included; throw itself does not act in a one-layer model"

[[feature]]
area = "Geology"
name = "Layers offset across faults (juxtaposition), layer surfaces that are not planes, a separate rock map for each layer"
known_for = "ECLIPSE, IMEX, tNavigator, Nexus"
absent = "fault.?trace"

[[feature]]
area = "Fluids"
name = "Laboratory tests read off the black-oil tables: constant-composition expansion, differential liberation, separator test"
known_for = "whitson+, PVTsim, PVTp"
tests = ["pvt_lab"]
