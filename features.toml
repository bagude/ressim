[[feature]]
area = "Fracture growth"
name = "Growth of one contained fracture: flow in the fracture, elastic opening, leak-off (constant height)"
known_for = "ResFrac, GOHFER, StimPlan, FracPro, Kinetix"
tests = ["growth_volume_balance", "growth_no_leakoff", "growth_leakoff_limit"]
note = "written here, not in the engine; the no-leak-off constants match the published values (PyFrac reference solution, Dontsov 2021) to four digits; heavy leak-off is checked against the closed-form limit only"

[[feature]]
area = "Fracture growth"
name = "Height-growth model: static cross-section formulas, and the contained limit (height does not grow in these checks)"
known_for = "FracPro, MFrac, StimPlan, GOHFER"
tests = ["height_section_formulas", "height_contained_limit"]

[[feature]]
area = "Fracture growth"
name = "Height growing through symmetric stress barriers (pseudo-3-D: equilibrium height in every cross-section)"
known_for = "FracPro, MFrac, StimPlan, GOHFER"
tests = ["height_growth_published"]
note = "written here; the reference is a published laboratory-scale case digitised from figures (about 1%); a planar 3-D model gives a lower height for the same case, so this checks the model class, not reality"

[[feature]]
area = "Fracture growth"
name = "Height growth at field scale with leak-off and toughness (mesh, table and trend checks)"
known_for = "FracPro, MFrac, StimPlan, GOHFER"
tests = ["height_growth_barriers"]

[[feature]]
area = "Fracture growth"
name = "Height in layered rock with unequal stresses above and below: cross-section formulas, and equal barriers against the three-layer solver"
known_for = "FracPro, MFrac, StimPlan, GOHFER"
tests = ["layers_section_formulas", "layers_equal_barriers", "layers_published"]
note = "written here; any number of layers with their own stress and toughness, fluid weight optional; one stiffness for all layers; landing depth inside the pay has no effect in this model class"

[[feature]]
area = "Fracture growth"
name = "Growth between unequal barriers, alone and with several clusters (mirror, fluid account, trend checks)"
known_for = "FracPro, MFrac, StimPlan, GOHFER"
tests = ["layers_unequal_barriers", "layers_with_clusters"]
note = "the height against pressure is checked against published cases in the row above; the growing fracture (length and height in time) between unequal barriers has no outside reference"

[[feature]]
area = "Fracture growth"
name = "Rock and pumping to production in one call (length and height predicted; conductivity and conductive share declared)"
known_for = "ResFrac"
tests = ["chain_design_to_production"]
note = "the pieces are checked separately; the chained result has no outside reference, and without a proppant model it is not a prediction end to end"

[[feature]]
area = "Fracture growth"
name = "Planar 3-D fracture (non-local elasticity, arbitrary layers, vertical flow)"
known_for = "ResFrac, Kinetix, GOHFER"
absent = "hydraulic.?fractur|fracture.?propagat|fracture.?growth"

[[feature]]
area = "Fracture growth"
name = "Stress shadow between the fractures of one stage: formula, and two identical fractures against the exact stiffer-rock solution"
known_for = "ResFrac, Kinetix, GOHFER"
tests = ["shadow_kernel", "multifrac_pair_stiffer", "multifrac_far_apart"]
note = "written here; local plane-strain shadow (a neighbour acts only where it is open at the same position along the length), uniform over the height"

[[feature]]
area = "Fracture growth"
name = "Several clusters growing together against a planar 3-D reference (five fractures, with and without perforation friction)"
known_for = "ResFrac, Kinetix"
tests = ["multifrac_published"]
note = "passes share-of-area bars of 20%; in absolute area the squeezed inner fractures are about a third larger than the reference, which has full 3-D elasticity and rock toughness at the leading edge"

[[feature]]
area = "Fracture growth"
name = "Clusters close together (a tenth to a quarter of the height apart): symmetry, fluid account, direction of effects"
known_for = "ResFrac, Kinetix"
tests = ["multifrac_interaction", "multifrac_one_cluster"]
note = "no outside reference at this spacing, which is where simplified shadow models are known to lose accuracy"

[[feature]]
area = "Fracture growth"
name = "Stress left by the stage before: what its fractures still hold open shadows the next stage"
known_for = "ResFrac, Kinetix"
tests = ["stage_shadow", "chain_stage_shadow"]
note = "written here; the earlier fractures close by leak-off down to their proppant pack and do not respond to the new stage; exact only for a uniform background; no outside reference"

[[feature]]
area = "Fracture growth"
name = "Fractures turning, merging or reopening earlier ones"
known_for = "ResFrac, Kinetix"
absent = "stress.?shadow"

[[feature]]
area = "Fracture growth"
name = "Proppant carried with the slurry: placement along the fracture, bridging in narrow sections, concentration by leak-off"
known_for = "ResFrac, GOHFER, StimPlan, FracPro, Kinetix"
tests = ["proppant_transport", "proppant_formulas"]
note = "written here; no slip along the fracture, and the flow does not feel proppant or screen-out"

[[feature]]
area = "Fracture growth"
name = "Propped half-length and conductivity predicted from the proppant pumped, fed to the production run"
known_for = "ResFrac, GOHFER, StimPlan, FracPro, Kinetix"
tests = ["chain_proppant_to_production"]
note = "pack permeability law and stress factor are from the literature, not checked here; no outside reference for the chained result"

[[feature]]
area = "Fracture growth"
name = "Proppant settling into a bank at the bottom of the fracture (hindered settling, bank growth)"
known_for = "ResFrac, GOHFER, StimPlan, FracPro, Kinetix"
tests = ["proppant_settling"]
note = "written here; exact for a closed slot (Kynch) and for the settling distance in a uniform flow; the speed at which the flow carries grains over the bank is a published pipe rule adapted to slots (McClure 2018), checked by its source only on 8 mm laboratory slots; the bank does not narrow the flow path"

[[feature]]
area = "Fracture growth"
name = "Proppant bank through to production: only the bank inside the pay conducts"
known_for = "ResFrac, GOHFER, StimPlan, FracPro, Kinetix"
tests = ["chain_settling_to_production"]
note = "no outside reference for the chained result"

[[feature]]
area = "Fracture growth"
name = "Screen-out pressure, proppant slowing the slurry, the bank narrowing the flow path"
known_for = "ResFrac, GOHFER, StimPlan, FracPro, Kinetix"
absent = "proppant"

[[feature]]
area = "Fracture growth"
name = "Perforation friction and the split of the stage rate between clusters (limited entry)"
known_for = "ResFrac, Kinetix"
tests = ["perforation_friction", "multifrac_limited_entry"]
note = "written here; one wellbore pressure for all clusters (no friction along the casing), fixed discharge coefficient (no erosion)"

[[feature]]
area = "Fracture growth"
name = "Multi-cluster stages through to production in one call"
known_for = "ResFrac"
tests = ["chain_clusters_to_production"]

[[feature]]
area = "Physics"
name = "Non-Darcy (Forchheimer) flow"
known_for = "ECLIPSE, IMEX/GEM"
absent = "non.?darcy|forchheimer"

[[feature]]
area = "Physics"
