# ==== END STREAM 9 ====

# ==== STREAM 10 features (pump schedule in steps; stop and continue) ====
[[feature]]
area = "Fracture growth"
name = "Pump schedule in steps: rate, fluid viscosity and sand concentration change from step to step; pauses and the shut-in are steps with zero rate"
known_for = "ResFrac, GOHFER, Kinetix, StimPlan, FracPro"
tests = ["stepped_equals_one_call", "stepped_directions", "stepped_field_units"]
note = "written here; a plan (rate, viscosity, time) fixes the grid, the cross-section table and the time steps when the job starts; one viscosity in the whole fracture at a time (no fluid front), no wellbore volume between surface and perforations, one rate per step (no ramp inside a step); with the same grid and time steps a one- or two-step schedule gives today's single call to the last digit"

[[feature]]
area = "Fracture growth"
name = "A job that can be stopped and continued: its state is plain data, kept in memory or in a file, and a continued job equals an uninterrupted one to the last digit"
known_for = "ResFrac (restart files), most commercial fracture simulators"
tests = ["stepped_continued_equals_uninterrupted", "stepped_limits"]
note = "written here; pumping returns a new job and leaves the old one as it was, so one job can be continued in two ways; the file is Julia's own Serialization format (exact, but tied to the Julia version: for keeping, not for exchange); a job that outgrows the grid or the table fixed at its start ends and says why, where a single call would be run again on a larger grid; a pressure limit ends the call, not the job"
# ==== END STREAM 10 ====
