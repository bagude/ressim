name = "ECLIPSE binary summary files (SMSPEC / UNSMRY) written from a run and read back, for ResInsight, Petrel and scripts"
known_for = "ECLIPSE; written by tNavigator, ECHELON, OPM Flow"
tests = ["eclout_record_layout", "eclout_reader_other_shapes"]
note = "written here (write_ecl_summary, read_ecl_summary); NOT yet opened by any other program: no file from another simulator and no independent reader were on this machine, so the layout is checked against bytes assembled by hand from its published description (research/ecl-binary-format.md lists what is confirmed and what is not) and by reading back; unified files only, every time its own report step, 4-byte reals, well names up to 8 characters; no restart, grid or formatted files"
